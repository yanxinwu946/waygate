[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waygate"
version = "1.0.0"
description = "A local proxy that leaves through Cloudflare WARP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sublarge" }]
keywords = ["cloudflare", "warp", "wireguard", "socks5", "proxy", "noise"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
waygate = "waygate.cli:main"

[project.urls]
Homepage = "https://github.com/yanxinwu946/waygate"

[tool.setuptools]
packages = ["waygate"]
