<!doctype html>
<html lang="zh-CN" data-theme="light" data-nav="expanded">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Waygate 控制台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到内容区</a>
  <div class="nav-backdrop" id="nav-backdrop" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <div class="brand-name">Waygate</div>
        <div class="brand-sub">线路控制台</div>
      </div>
      <button class="icon-btn collapse-btn" id="btn-collapse" type="button" aria-label="折叠侧栏" title="折叠侧栏" aria-expanded="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav" id="nav">
      <a class="nav-item is-active" href="#/overview" data-route="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>概览</span>
      </a>
      <a class="nav-item" href="#/instances" data-route="instances">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span>线路</span>
      </a>
      <a class="nav-item" href="#/endpoints" data-route="endpoints">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        <span>端点</span>
      </a>
      <a class="nav-item" href="#/routing" data-route="routing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M8.5 7.5 15 16M16 8.5v7M8.5 16.5 15 8"/></svg>
        <span>调度</span>
      </a>
      <a class="nav-item" href="#/account" data-route="account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 14.5-4 16 0"/></svg>
        <span>账号</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <button class="account-chip" id="btn-account-menu" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" aria-hidden="true">W</span>
        <span class="account-meta">
          <span class="account-name">本地操作员</span>
          <span class="account-role">本机控制台</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </aside>

  <div class="shell" id="shell">
    <header class="toolbar" id="toolbar">
      <div class="toolbar-left">
        <button class="icon-btn mobile-only" id="btn-menu" type="button" aria-label="打开导航" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <h1 class="page-title" id="page-title">概览</h1>
          <p class="page-sub" id="page-sub">运行状态与统一入口</p>
        </div>
      </div>
      <div class="toolbar-right">
        <div class="toolbar-status" id="toolbar-status">正在连接…</div>
        <div class="theme-switch" role="group" aria-label="主题">
          <button type="button" data-theme-set="light" title="浅色" aria-label="浅色模式">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" data-theme-set="system" title="跟随系统" aria-label="跟随系统">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          </button>
          <button type="button" data-theme-set="dark" title="深色" aria-label="深色模式">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A9 9 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
        </div>
      </div>
    </header>
    <main class="content" id="main" tabindex="-1"></main>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="menu-root"></div>
  <script src="/app.js"></script>
</body>
</html>
